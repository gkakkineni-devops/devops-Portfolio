name: Portfolio CI

on:
  push:
    branches:
      - main
      - "feature/**"

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  # ---------------------------------------------------------
  # JOB 1: Check the portfolio files
  # ---------------------------------------------------------
  validate:
    name: Validate Portfolio
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          echo "Checking portfolio files..."

          test -f index.html
          test -f Dockerfile

          echo "Required files are present."

      - name: Show project structure
        run: |
          echo "Portfolio project files:"
          find . -maxdepth 2 -type f


  # ---------------------------------------------------------
  # JOB 2: Build and test the Docker container
  # ---------------------------------------------------------
  docker-test:
    name: Build and Test Docker Container
    runs-on: ubuntu-24.04
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t portfolio-ci .

      - name: Run Docker container
        run: |
          docker run -d \
            --name portfolio-ci \
            -p 8080:80 \
            portfolio-ci

      - name: Wait for NGINX
        run: |
          sleep 5

      - name: Test website
        run: |
          curl --fail http://localhost:8080

      - name: Show running containers
        run: |
          docker ps

      - name: Clean up container
        if: always()
        run: |
          docker rm -f portfolio-ci || true


  # ---------------------------------------------------------
  # JOB 3: Publish Docker image to GitHub Container Registry
  # ---------------------------------------------------------
  publish-image:
    name: Publish Docker Image
    runs-on: ubuntu-24.04

    needs:
      - validate
      - docker-test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Build Docker image for GHCR
        run: |
          docker build \
            -t ghcr.io/gkakkineni-devops/devops-portfolio:latest \
            -t ghcr.io/gkakkineni-devops/devops-portfolio:${{ github.sha }} \
            .

      - name: Push latest Docker image
        run: |
          docker push ghcr.io/gkakkineni-devops/devops-portfolio:latest

      - name: Push commit-specific Docker image
        run: |
          docker push ghcr.io/gkakkineni-devops/devops-portfolio:${{ github.sha }}

      - name: Confirm published image
        run: |
          echo "Docker image published successfully."
          echo "Latest image:"
          echo "ghcr.io/gkakkineni-devops/devops-portfolio:latest"
          echo "Commit image:"
          echo "ghcr.io/gkakkineni-devops/devops-portfolio:${{ github.sha }}"