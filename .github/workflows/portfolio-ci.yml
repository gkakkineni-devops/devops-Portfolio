name: Portfolio CI


on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:


permissions:
  contents: read


jobs:

  validate:

    name: Validate Portfolio

    runs-on: ubuntu-24.04

    timeout-minutes: 5


    steps:

      - name: Checkout repository
        uses: actions/checkout@v6


      - name: Verify required project files
        shell: bash
        run: |
          test -f index.html
          test -f css/style.css
          test -f js/main.js
          test -f README.md
          test -f .gitignore
          test -f Dockerfile
          test -f .dockerignore

          echo "All required project files exist."


      - name: Verify HTML references
        shell: bash
        run: |
          grep -q '<!DOCTYPE html>' index.html
          grep -q 'css/style.css' index.html
          grep -q 'js/main.js' index.html

          echo "Basic HTML references look correct."


      - name: Check for committed environment files
        shell: bash
        run: |
          if git ls-files | grep -Eq '(^|/)\.env(\.local)?$'; then
            echo "ERROR: A local environment file has been committed."
            exit 1
          fi

          echo "No committed .env files detected."


      - name: Validation completed
        run: echo "Portfolio source validation passed."



  docker-test:

    name: Docker Build and Test

    runs-on: ubuntu-24.04

    timeout-minutes: 10

    needs: validate


    steps:

      - name: Checkout repository
        uses: actions/checkout@v6


      - name: Check Docker installation
        run: docker version


      - name: Build Docker image
        run: |
          docker build \
            -t devops-portfolio:ci \
            .


      - name: Start portfolio container
        run: |
          docker run \
            --name portfolio-ci \
            -d \
            -p 127.0.0.1:8080:80 \
            devops-portfolio:ci


      - name: Verify container is running
        run: |
          docker ps

          docker inspect \
            --format='{{.State.Running}}' \
            portfolio-ci


      - name: Test portfolio website
        shell: bash
        run: |
          echo "Waiting for Nginx to become available..."

          for attempt in {1..10}; do

            if curl -fsS \
              http://127.0.0.1:8080/ \
              -o /tmp/portfolio.html; then

              echo "Portfolio responded successfully."
              break
            fi

            echo "Attempt $attempt failed. Retrying..."
            sleep 1

          done


          test -s /tmp/portfolio.html


          grep -q \
            'Gopala Krishna Akkineni' \
            /tmp/portfolio.html


          curl -fsS \
            http://127.0.0.1:8080/css/style.css \
            > /dev/null


          curl -fsS \
            http://127.0.0.1:8080/js/main.js \
            > /dev/null


          echo "Portfolio container tests passed."


      - name: Show container logs
        if: always()
        run: |
          docker logs portfolio-ci || true


      - name: Clean up container
        if: always()
        run: |
          docker rm -f portfolio-ci || true
            
    publish-image:

    name: Publish Docker Image

    runs-on: ubuntu-24.04

    timeout-minutes: 10

    needs:
      - validate
      - docker-test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write


    steps:

      - name: Checkout repository
        uses: actions/checkout@v6


      - name: Prepare container image name
        shell: bash
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"

          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"

          echo "Container image: $IMAGE_NAME"


      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Build container image
        shell: bash
        run: |
          docker build \
            -t "$IMAGE_NAME:latest" \
            -t "$IMAGE_NAME:${GITHUB_SHA}" \
            .


      - name: Push container image
        shell: bash
        run: |
          docker push "$IMAGE_NAME:latest"

          docker push "$IMAGE_NAME:${GITHUB_SHA}"


      - name: Show published image information
        shell: bash
        run: |
          echo "Published:"
          echo "$IMAGE_NAME:latest"
          echo "$IMAGE_NAME:${GITHUB_SHA}"